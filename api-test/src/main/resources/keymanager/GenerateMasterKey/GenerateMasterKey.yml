GenerateMasterKey:

  KeyManager_GenerateMasterKey_Certificate_Valid_Smoke:
    endPoint: /v1/keymanager/generateMasterKey/CERTIFICATE
    uniqueIdentifier: TC_KeyManager_GenerateMasterKey_01
    description: Generate master key for automation applicationId using CERTIFICATE objectType - validates PEM certificate in response.
    role: admin
    restMethod: post
    inputTemplate: keymanager/GenerateMasterKey/GenerateMasterKey
    outputTemplate: keymanager/GenerateMasterKey/GenerateMasterKeyResult
    input: '{
      "applicationId": "$KEYMANAGERAPPID$",
      "referenceId": "",
      "force": false,
      "requesttime": "$TIMESTAMP$"
    }'
    output: '{
      "certificate": "$REGEXP:(?s).*-----BEGIN CERTIFICATE-----.*",
      "certIsValid": "true",
      "certKeyUsageValid": "true"
    }'

  KeyManager_GenerateMasterKey_CSR_Valid_Smoke:
    endPoint: /v1/keymanager/generateMasterKey/CSR
    uniqueIdentifier: TC_KeyManager_GenerateMasterKey_02
    description: Generate master key for automation applicationId using CSR objectType - validates PEM CSR in response.
    role: admin
    restMethod: post
    inputTemplate: keymanager/GenerateMasterKey/GenerateMasterKey
    outputTemplate: keymanager/GenerateMasterKey/GenerateMasterKeyCSRResult
    input: '{
      "applicationId": "$KEYMANAGERAPPID$",
      "referenceId": "",
      "force": false,
      "requesttime": "$TIMESTAMP$"
    }'
    output: '{
      "certSignRequest": "$REGEXP:(?s).*-----BEGIN CERTIFICATE REQUEST-----.*"
    }'

  KeyManager_GenerateMasterKey_Certificate_WithSubjectFields_Valid:
    endPoint: /v1/keymanager/generateMasterKey/CERTIFICATE
    uniqueIdentifier: TC_KeyManager_GenerateMasterKey_03
    description: Generate master key with all optional subject fields (CN, OU, O, L, ST, C) using CERTIFICATE objectType.
    role: admin
    restMethod: post
    inputTemplate: keymanager/GenerateMasterKey/GenerateMasterKey
    outputTemplate: keymanager/GenerateMasterKey/GenerateMasterKeyResult
    input: '{
      "applicationId": "$KEYMANAGERAPPID$",
      "referenceId": "",
      "force": false,
      "commonName": "www.mosip.io",
      "organizationUnit": "MOSIP-TECH-CENTER",
      "organization": "IITB",
      "location": "BANGALORE",
      "state": "KA",
      "country": "IN",
      "requesttime": "$TIMESTAMP$"
    }'
    output: '{
      "certificate": "$REGEXP:(?s).*-----BEGIN CERTIFICATE-----.*",
