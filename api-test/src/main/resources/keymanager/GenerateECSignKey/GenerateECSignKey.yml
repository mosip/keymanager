  KeyManager_GenerateECSignKey_Certificate_SECP256R1_Valid_Smoke:
    endPoint: /v1/keymanager/generateECSignKey/CERTIFICATE
    uniqueIdentifier: TC_KeyManager_GenerateECSignKey_01
    description: Generate EC sign key using SECP256R1 curve with CERTIFICATE objectType - validates PEM certificate in response.
    role: admin
    restMethod: post
    inputTemplate: keymanager/GenerateECSignKey/GenerateECSignKey
    outputTemplate: keymanager/GenerateECSignKey/GenerateECSignKeyResult
    input: '{
      "applicationId": "$KEYMANAGERAPPID$",
      "referenceId": "EC_SECP256R1_SIGN",
      "force": false,
      "requesttime": "$TIMESTAMP$"
    }'
    output: '{
      "certificate": "$REGEXP:(?s).*-----BEGIN CERTIFICATE-----.*",
      "certIsValid": "true",
      "certKeyUsageValid": "true"
    }'

