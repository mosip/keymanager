
# Application name - usage of existing service name to reuse configuration
spring.application.name=kernel-keymanager-service
spring.cloud.config.name=kernel

#Active Profile
spring.profiles.active=local

# url where spring cloud config server is running 
spring.cloud.config.uri=localhost

# keymanager specific
keymanager.persistence.jdbc.schema=keymgr

# management endpoints
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh,restart

# disabling health check for config
health.config.enabled=false
